[project]
name = "comfyui-mediaforge"
description = "Power-user FFmpeg toolkit for ComfyUI. Tensor<->media bridge with broadcast-grade codec control: subtitle burn-in, multi-overlay Compose pipeline, provider-agnostic AI transcribe/translate, NVENC-aware. Depth > breadth."
version = "0.7.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Mirrors requirements.txt (ComfyUI Manager installs from there; this keeps
# registry / pip metadata honest). Heavy optional deps (faster-whisper) stay
# lazy-imported and deliberately unlisted — see requirements.txt rationale.
dependencies = [
    "imageio-ffmpeg>=0.4.9",
    "static-ffmpeg>=2.5",
    "opencc-python-reimplemented>=0.1.7",
    "requests>=2.28",
    "fontTools>=4.0",
    "charset-normalizer>=3.0",
]

[project.urls]
Repository = "https://github.com/leon80148/comfyui_MediaForge"

[tool.comfy]
PublisherId = "leon80148"
DisplayName = "MediaForge"
Icon = ""

[tool.ruff]
# 繼承 ComfyUI 主 repo 的 ruff 規則 (selects N805, S307, S102, E, T, W, F)，
# 但本 plugin 把 `print` 當使用者面向 UX channel (見 CLAUDE.md 慣例)，故 ignore T201。
lint.select = ["N805", "S307", "S102", "E", "T", "W", "F"]
lint.ignore = ["E501", "E722", "E731", "E712", "E402", "E741", "T201"]
exclude = ["*.ipynb", "tests/__pycache__/*"]
